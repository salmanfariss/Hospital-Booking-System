<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patient Registration | MediCare</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f4f7fb;
        }

        .register-card {
            width: 450px;
            max-width: 90%;

            background: white;

            padding: 45px;

            border-radius: 25px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;

            font-size: 42px;

            margin-bottom: 10px;
        }

        h1 {
            text-align: center;

            margin: 0 0 10px;

            color: #17213a;

            font-size: 34px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            font-size: 17px;

            margin-bottom: 30px;

            line-height: 1.5;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 16px;

            font-weight: bold;

            color: #17213a;
        }

        .normal-input {
            width: 100%;

            padding: 15px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 16px;

            margin-bottom: 20px;

            outline: none;
        }

        .normal-input:focus {
            border-color: #2563eb;
        }

        .password-wrapper {
            position: relative;

            width: 100%;

            margin-bottom: 20px;
        }

        .password-wrapper input {
            width: 100%;

            padding: 15px 50px 15px 15px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        .password-wrapper input:focus {
            border-color: #2563eb;
        }

        .show-password {
            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            font-size: 20px;

            color: #64748b;

            user-select: none;
        }

        .show-password:hover {
            color: #2563eb;
        }

        .register-btn {
            width: 100%;

            border: none;

            background: #2563eb;

            color: white;

            padding: 16px;

            border-radius: 10px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;

            border: 1px solid #fecaca;

            color: #b91c1c;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 20px;

            text-align: center;
        }

        .login-link {
            text-align: center;

            margin-top: 25px;

            color: #64748b;

            font-size: 16px;
        }

        .login-link a {
            color: #2563eb;

            font-weight: bold;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="register-card">

    <div class="logo">
        🏥
    </div>


    <h1>
        Create Account
    </h1>


    <div class="subtitle">
        Register as a patient to book your appointment
    </div>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <!-- FULL NAME -->

        <label>
            Full Name
        </label>

        <input
            class="normal-input"
            type="text"
            name="name"
            placeholder="Enter your full name"
            value="{{ name }}"
            required
        >


        <!-- USERNAME -->

        <label>
            Username
        </label>

        <input
            class="normal-input"
            type="text"
            name="username"
            placeholder="Enter your username"
            value="{{ username }}"
            required
        >


        <!-- EMAIL -->

        <label>
            Email Address
        </label>

        <input
            class="normal-input"
            type="email"
            name="email"
            placeholder="Enter your email"
            value="{{ email }}"
            required
        >


        <!-- PASSWORD -->

        <label>
            Password
        </label>

        <div class="password-wrapper">

            <input
                id="password"
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <span
                class="show-password"
                onclick="togglePassword('password', this)"
            >
                👁️
            </span>

        </div>


        <!-- CONFIRM PASSWORD -->

        <label>
            Confirm Password
        </label>

        <div class="password-wrapper">

            <input
                id="confirm_password"
                type="password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
            >

            <span
                class="show-password"
                onclick="togglePassword('confirm_password', this)"
            >
                👁️
            </span>

        </div>


        <button
            type="submit"
            class="register-btn"
        >
            Create Account
        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="{% url 'patient_login' %}">
            Login
        </a>

    </div>


</div>


<script>

function togglePassword(inputId, icon) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";

        icon.textContent = "🙈";

    } else {

        input.type = "password";

        icon.textContent = "👁️";

    }

}

</script>


</body>

</html>
