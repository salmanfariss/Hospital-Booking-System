<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patient Login | MediCare</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background: #f4f7fb;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #17213a;
        }

        .login-container {
            width: 100%;
            max-width: 500px;

            padding: 20px;
        }

        .login-card {
            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;

            font-size: 36px;
            font-weight: bold;

            color: #2563eb;

            margin-bottom: 25px;
        }

        .icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            background: #dbeafe;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
        }

        h1 {
            text-align: center;

            font-size: 32px;

            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            font-size: 17px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        .error {
            background: #fee2e2;

            border: 1px solid #fecaca;

            color: #b91c1c;

            padding: 13px;

            border-radius: 10px;

            text-align: center;

            margin-bottom: 20px;

            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 9px;
        }

        input {
            width: 100%;

            padding: 15px 16px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            outline: none;

            font-size: 17px;

            color: #17213a;
        }

        input:focus {
            border-color: #2563eb;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 55px;
        }

        .toggle-password {
            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            background: none;

            border: none;

            padding: 0;

            margin: 0;

            width: auto;

            color: #64748b;

            font-size: 21px;

            cursor: pointer;
        }

        .toggle-password:hover {
            background: none;
            color: #2563eb;
        }

        .login-btn {
            width: 100%;

            border: none;

            background: #2563eb;

            color: white;

            padding: 16px;

            border-radius: 10px;

            font-size: 18px;

            cursor: pointer;

            margin-top: 5px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .register-link {
            text-align: center;

            margin-top: 25px;

            color: #64748b;

            font-size: 16px;
        }

        .register-link a {
            color: #2563eb;

            font-weight: bold;

            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #64748b;

            text-decoration: none;

            font-size: 16px;
        }

        .back:hover {
            color: #2563eb;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            MediCare
        </div>

        <div class="icon">
            👤
        </div>

        <h1>
            Patient Login
        </h1>

        <p class="subtitle">
            Enter your details to continue and book your appointment.
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Your Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                        id="toggleButton"
                    >
                        👁
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Continue to Doctors →
            </button>

        </form>


        <div class="register-link">

            Don't have an account?

            <a href="{% url 'patient_register' %}">
                Register here
            </a>

        </div>


        <a
            href="/"
            class="back"
        >
            ← Back to Home
        </a>

    </div>

</div>


<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.getElementById("toggleButton");


    if (password.type === "password") {

        password.type = "text";

        button.textContent = " 👁️";

    } else {

        password.type = "password";

        button.textContent = "👁";

    }

}

</script>

</body>

</html>
